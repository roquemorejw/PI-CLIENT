<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Talk to the Agent</title>
  <style>
    :root {
      --navy:#162D50; --burgundy:#801326; --ink:#0E1116; --bg:#F7F8FA; --card:#FFFFFF;
    }
    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0; background:var(--bg); color:var(--ink);
      font-family:Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      display:flex; align-items:center; justify-content:center; padding:16px;
    }
    .wrap{
      width:100%; max-width:900px; background:var(--card); border-radius:16px;
      box-shadow:0 6px 24px rgba(0,0,0,.08); padding:22px;
    }
    .hdr{display:flex; align-items:center; gap:12px; margin-bottom:12px}
    .dot{width:10px;height:10px;border-radius:9999px;background:var(--burgundy)}
    h1{font-size:20px; margin:0}
    p.hint{font-size:14px; opacity:.8; margin-top:4px}
    .agent{
      position:relative; width:100%; min-height:520px;
      border:1px solid #e6e8ec; border-radius:12px; overflow:hidden;
      display:flex; align-items:stretch; justify-content:stretch; background:#fff;
    }
    .fallback{
      padding:24px; width:100%; display:flex; align-items:center; justify-content:center; text-align:center;
    }
    .note{font-size:13px; margin-top:10px; opacity:.7}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="hdr">
      <div class="dot"></div>
      <h1>Talk to the Agent</h1>
    </div>
    <p class="hint">Click the microphone and allow access if prompted. Best experienced in Chrome/Edge over HTTPS.</p>

    <div class="agent">
      <!-- ElevenLabs Convai Widget -->
      <elevenlabs-convai agent-id="agent_8401k9am63bgfmfbhf7fnk8wr2be"></elevenlabs-convai>
      <script src="https://unpkg.com/@elevenlabs/convai-widget-embed" async type="text/javascript"></script>
      <noscript>
        <div class="fallback">
          <div>
            <strong>JavaScript is required to load the agent.</strong>
            <div class="note">Please enable JavaScript or open this page in a modern browser.</div>
          </div>
        </div>
      </noscript>
    </div>

    <p class="note">If your LMS blocks microphone access in an iframe, <em>open this page in a new window</em> instead of embedding.</p>
  </div>
</body>
</html>
